name: Build macOS bundle

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked --all-targets
      - name: Build and archive application
        run: scripts/package-macos.sh
      - name: Upload bundle for the runner architecture
        uses: actions/upload-artifact@v4
        with:
          name: Lingo-macOS-${{ runner.arch }}
          path: |
            dist/Lingo-v*-macos-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
