name: Build macOS bundle

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked --all-targets
      - name: Build local application bundle
        run: scripts/bundle-macos.sh
      - name: Archive application
        run: ditto -c -k --sequesterRsrc --keepParent dist/Lingo.app dist/Lingo-macOS.zip
      - name: Upload bundle for the runner architecture
        uses: actions/upload-artifact@v4
        with:
          name: Lingo-macOS-${{ runner.arch }}
          path: dist/Lingo-macOS.zip
          if-no-files-found: error
          retention-days: 14
